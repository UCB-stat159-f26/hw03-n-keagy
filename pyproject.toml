[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Get and plot tennis career match data from Tennis Abstract"
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib"]

[tool.setuptools.packages.find]
include = ["tennis_career*"]
